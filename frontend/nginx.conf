server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Le chiamate REST /api/... vanno al backend
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Il WebSocket: servono questi header speciali per "aggiornare" la connessione HTTP a WebSocket
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
