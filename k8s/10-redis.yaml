# Redis Stack: code (Streams) + checkpointer LangGraph. Niente volume: dati effimeri (ok per sviluppo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tuscany-router
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:latest
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
# Il Service dà a Redis un nome DNS stabile: gli altri pod lo raggiungono con "redis:6379"
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tuscany-router
spec:
  selector: { app: redis }
  ports:
    - port: 6379
