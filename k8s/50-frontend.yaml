apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tuscany-router
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: tuscany/frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tuscany-router
spec:
  selector: { app: frontend }
  ports:
    - port: 80
